# Put configuration options here
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_KEYBOARD_NAME="Oreo"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Underglow (RGB): off by default. To use it only on USB, switch CONFIG_ZMK_RGB_UNDERGLOW to =y;
# the two lines below then apply. They do nothing while underglow is off.
# - AUTO_OFF_USB: underglow turns off when USB is unplugged (and is off at start on battery)
# - BRT_MAX=50: max brightness 50%, keeps underglow + backlight + charging under the USB limit
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
